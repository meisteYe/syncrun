name: SyncRun ML Nightly Retrain

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write # Botun yazma yetkisi (Kesin güvence)

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Git geçmişinin tamamını çek ki çakışma yaşanmasın

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Firebase JSON Anahtarını Oluştur
        run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > ml_pipeline/syncrun-firebase-adminsdk.json

      - name: Bağımlılıkları Yükle
        run: |
          cd ml_pipeline
          pip install -r requirements.txt

      - name: Verileri Çek ve Modeli Eğit
        run: |
          cd ml_pipeline
          python data_pipeline.py
          python train_model.py

      # Manuel git komutları yerine resmi eklenti kullanıyoruz
      - name: Değişiklikleri Commit Et ve Gönder
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 [Auto] Yapay Zeka modeli yeni verilerle eğitildi"
          file_pattern: "ml_pipeline/syncrun_pace_model.cbm ml_pipeline/syncrun_activities_ml_ready.csv"
