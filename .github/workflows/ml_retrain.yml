name: SyncRun ML Nightly Retrain

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Firebase JSON Anahtarını Oluştur
        run: |
          echo "${{ secrets.FIREBASE_CREDENTIALS }}" > ml_pipeline/syncrun-firebase-adminsdk.json

      - name: Bağımlılıkları Yükle
        run: |
          cd ml_pipeline
          pip install -r requirements.txt

      - name: Verileri Çek ve Modeli Eğit
        run: |
          cd ml_pipeline
          python data_pipeline.py
          python train_model.py

      - name: Yeni Modeli Github'a Gönder
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ml_pipeline/syncrun_pace_model.cbm
          git add ml_pipeline/syncrun_activities_ml_ready.csv
          git commit -m "🤖 [Auto] Yapay Zeka modeli yeni verilerle eğitildi" || true
          git push
