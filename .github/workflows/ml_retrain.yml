name: SyncRun ML Nightly Retrain

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  retrain-model:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actions'ın repoya yazabilmesi için resmi izin bloğu

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python 3.11 Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Firebase JSON Anahtarını Oluştur
        run: |
          echo '${{ secrets.FIREBASE_CREDENTIALS }}' > ml_pipeline/syncrun-firebase-adminsdk.json

      - name: Bağımlılıkları Yükle
        run: |
          cd ml_pipeline
          pip install -r requirements.txt

      - name: Verileri Çek ve Modeli Eğit
        run: |
          cd ml_pipeline
          python data_pipeline.py
          python train_model.py

      - name: Yeni Modeli Github'a Gönder
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add ml_pipeline/syncrun_pace_model.cbm
          git add ml_pipeline/syncrun_activities_ml_ready.csv
          git commit -m "🤖 [Auto] Yapay Zeka modeli yeni verilerle eğitildi" || echo "Değişiklik yok, commit atlanıyor"
          git push
